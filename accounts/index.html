<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#291B25">
<meta name="description" content="NanoFly InfoTech – clients, invoices, quotations, receipts and payments">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NanoFly">
<meta name="application-name" content="NanoFly Accounts">
<title>NanoFly InfoTech – Accounts</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&family=Jost:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/brand-fonts.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Loader: covers the screen while the portal opens and while the server is working -->
<div id="loader" class="loader on full" role="status" aria-live="polite">
  <div class="ld-box"><img src="assets/mark-tight.png" alt=""><div class="ld-bar"><i></i></div><p id="ldmsg">Opening NanoFly Accounts…</p></div>
</div>

<!-- Login -->
<section id="login" class="login">
  <div class="login-card">
    <img class="brand-logo login-logo" alt="NanoFly InfoTech">
    <h1>Accounts</h1>
    <p class="muted">Log in to manage clients, invoices and payments.</p>
    <form onsubmit="event.preventDefault();doLogin()">
      <label>Username<input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label>Password<input id="lp" type="password" autocomplete="current-password"></label>
      <p id="lerr" class="err" role="alert"></p>
      <button id="lbtn" class="btn primary block">Log in</button>
    </form>
  </div>
</section>

<!-- App -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <a class="side-logo" href="#dashboard" aria-label="NanoFly InfoTech – Dashboard"><img class="brand-logo" data-on-dark alt="NanoFly InfoTech"></a>
    <nav id="nav" class="side-nav" aria-label="Main"></nav>
    <div class="side-user">
      <div><b id="uname"></b><span id="urole"></span></div>
      <button class="link" onclick="changePw()">Change password</button>
      <button class="link" onclick="logout()">Log out</button>
    </div>
  </aside>

  <header class="top">
    <img class="brand-mark" alt="" src="assets/mark-tight.png">
    <h1 id="ptitle">Dashboard</h1>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search clients, invoices, projects…" autocomplete="off" oninput="search(this.value)" onfocus="search(this.value)">
      <div id="qres" class="qres" hidden></div>
    </div>
    <select id="fy" class="fy" onchange="FY=this.value;render()" aria-label="Year (January – December)"></select>
    <div class="newwrap">
      <button id="newbtn" class="btn primary" onclick="toggleNew(event)"><span class="plus">+</span><span class="lbl">New</span></button>
      <div id="newmenu" class="menu" hidden></div>
    </div>
  </header>

  <main id="main" class="main"></main>

  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
</div>

<!-- Dialog -->
<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="sheet-head"><h2 id="mt"></h2><button class="x" onclick="closeM()" aria-label="Close">×</button></div>
    <div id="mb" class="form"></div>
    <div class="sheet-foot"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" id="msave">Save</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/documents.js"></script>
<script>initApp();</script>
</body>
</html>
