<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Money</title>
<link rel="icon" type="image/png" href="img/favicon-64.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ED5B2D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="i-bill" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
<symbol id="i-debt" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></symbol>
<symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 004 0"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
<symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7a2 2 0 012-2h12v4"/><path d="M4 7v11a2 2 0 002 2h14V9H6a2 2 0 01-2-2z"/><path d="M16 14h.01"/></symbol>
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M5 19V5h3v6l6-6h4l-7 7 7 7h-4l-6-6v6z"/></symbol>
</defs></svg>

<div id="login" hidden>
  <form class="lcard" id="loginForm" autocomplete="on">
    <img class="llogo" src="img/logo.png" alt="My Money. Track, plan, grow.">
    <h1>Welcome back</h1>
    <p>Enter your password once. This phone stays signed in.</p>
    <label class="lf"><span>Password</span><input id="lkey" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="Enter your password" required></label>
    <button class="lshow" id="lshow" type="button">Show</button>
    <p class="lerr" id="lerr" role="alert"></p>
    <button class="btn pri lbtn" id="lgo" type="submit">Sign in</button>
  </form>
</div>
<div class="shell">
  <aside class="side" aria-label="Main navigation">
    <div class="brand"><span class="mk"><img src="img/mark.png" alt="" width="40" height="34"></span><span class="bt">My Money<small>Track · Plan · Grow</small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <button id="themeBtn" type="button"><svg class="i"><use href="#i-moon"/></svg><span>Switch theme</span></button>
      <button data-act="settings" type="button"><svg class="i"><use href="#i-gear"/></svg><span>Settings</span></button>
      <p class="sync" id="syncSt" role="status"></p>
    </div>
  </aside>
  <main class="main" id="main">
    <div id="view"></div>
  </main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
<div id="overlay"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>

<script src="js/config.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
